<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" role="img" aria-labelledby="title desc">
  <title id="title">Quarto AutonomousRim de 5×5 células internas</title>
  <desc id="desc">Cômoda, cabeceira e cabeça da cama contra a parede norte. Espaço reservado de duas por duas células para cama de casal. Vaso no sudoeste e porta a leste.</desc>
  <defs><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#c6b9a9"/></pattern></defs>
  <rect width="540" height="500" fill="#f6f2ea"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#273347">
    <text x="30" y="38" font-size="23" font-weight="700">Quarto 5×5 • novos planos</text>
    <text x="30" y="65" font-size="14">Norte ↑ • cabeça da cama junto à parede</text>
    <rect x="58" y="90" width="336" height="336" fill="#bca388"/>
    <rect x="66" y="98" width="320" height="320" fill="#eee4d7"/>
    <rect x="66" y="98" width="320" height="320" fill="url(#grid)"/>
    <rect x="71" y="103" width="118" height="54" rx="4" fill="#af865a"/>
    <text x="130" y="134" text-anchor="middle" font-size="16">Cômoda</text>
    <rect x="199" y="103" width="54" height="54" rx="4" fill="#c59c6a"/>
    <text x="226" y="126" text-anchor="middle" font-size="11">Mesa de</text><text x="226" y="143" text-anchor="middle" font-size="11">cabeceira</text>
    <rect x="263" y="103" width="118" height="118" rx="4" fill="none" stroke="#4c8d8b" stroke-dasharray="6 4" stroke-width="3"/>
    <rect x="267" y="107" width="48" height="110" rx="5" fill="#9ec0c8"/>
    <rect x="271" y="111" width="40" height="24" rx="4" fill="#fff"/>
    <text x="291" y="184" text-anchor="middle" font-size="13">Cama</text>
    <text x="349" y="151" text-anchor="middle" font-size="11">Reserva</text><text x="349" y="169" text-anchor="middle" font-size="11">casal</text>
    <circle cx="98" cy="386" r="21" fill="#b18053"/><circle cx="98" cy="386" r="14" fill="#6d965c"/>
    <text x="131" y="391" font-size="13">Vaso</text>
    <circle cx="98" cy="258" r="15" fill="#edc469"/><text x="120" y="263" font-size="12">Luz*</text>
    <rect x="382" y="296" width="12" height="52" fill="#b78d5c"/><text x="404" y="327" font-size="13">Porta →</text>
    <text x="30" y="455" font-size="14">Reserva 2×2: troca futura, sem mover os outros móveis.</text>
    <text x="30" y="481" font-size="12">* Com pesquisa elétrica. Cama de casal ainda não é instalada automaticamente.</text>
  </g>
</svg>
